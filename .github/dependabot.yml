version: 2
updates:
  # npm workspaces: one entry at the root covers packages/ and app/.
  # Separate entries for those directories produced duplicate PRs.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Expo SDK 58 / React Native 0.88 load Babel 7 plugins and
      # babel-preset-expo peers on @babel/core ^7. Babel 8 is ESM-only,
      # so hold this major until the Expo toolchain supports it.
      - dependency-name: "@babel/core"
        update-types:
          - "version-update:semver-major"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
